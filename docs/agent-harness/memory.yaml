schema_version: 1
updated: "2026-10-29"

project:
  name: "Code Terminal"
  repo_root: "D:\\freelife\\opencode-workbench"
  summary: "Tauri + React + TypeScript + Rust terminal workbench with desktop exe and server Web UI."
  language: "zh-CN"
  primary_surfaces:
    - "Windows desktop exe"
    - "macOS desktop dmg (Apple Silicon)"
    - "Linux server Web UI for phone access"

commands:
  install: "npm install"
  dev_frontend: "npm run dev:frontend"
  dev_tauri: "npm run dev"
  build_frontend: "npm run build:frontend"
  build_windows_exe: "npm run build"
  build_macos_dmg: "npm run bundle:mac"
  build_macos_universal: "rustup target add x86_64-apple-darwin && npm run bundle:mac:universal"
  build_server: "npm run build:server"
  run_server: "npm run server"
  local_full_stack_test: "npm run server"

artifacts:
  frontend_dist: "dist/"
  windows_exe: "src-tauri/target/release/code-terminal.exe"
  macos_app: "src-tauri/target/release/bundle/macos/Code Terminal.app"
  macos_dmg: "src-tauri/target/release/bundle/dmg/Code Terminal_<version>_aarch64.dmg"
  server_binary: "src-tauri/target/release/code-terminal-server"

build_environment:
  - "macOS bundle 需要 icons/icon.icns，tauri-build 在 Unix 目标下还需要 icons/icon.png，两者都要和 icons/icon.ico 一起维护。"
  - "macOS 本机未接受 Xcode 许可时链接会失败；正式环境执行 sudo xcodebuild -license，临时绕行可用 DEVELOPER_DIR=/Library/Developer/CommandLineTools npm run bundle:mac。"
  - "macOS 发布前未配置签名和 notarization，用户首次启动需要在系统设置里手动允许。"
  - "tauri.macos.conf.json 的 app.windows 会整段替换基础窗口配置，修改窗口尺寸、标题或最小尺寸时必须同步更新该文件。"

deployment:
  release_sync_policy:
    - "After code changes are complete, keep the local git commit, origin/main, and the phone server deployment aligned to the same version whenever deployment is requested or implied."
    - "A change is not fully server-synced until the public phone server URL serves the latest built dist asset hashes."
    - "If SSH credentials or server access block deployment, report the exact local commit and public server asset hashes instead of marking the server as synced."
    - "Never store or print server passwords, tokens, certificates, or .env contents while syncing versions."
  phone_server:
    host: "8.148.225.35"
    public_url: "http://8.148.225.35:8787/"
    ssh_user: "root"
    app_dir: "/opt/code-terminal"
    dist_dir: "/opt/code-terminal/dist"
    service: "code-terminal.service"
    service_user: "root"
    runtime_policy: "User explicitly requests root as the default for this Code Terminal deployment (2026-10-29); do not silently restore an unprivileged account. Other product boundaries still apply."
    env_file: "/etc/code-terminal.env"
    state_file: "/opt/code-terminal-state/workbench-state.json"
    workspace_dir: "/opt"
    runtime_home: "/root"
    codex_binary: "/usr/local/bin/codex"
    codex_version: "0.165.0"
    codex_config: "/root/.codex/config.toml (root 0600; never copy its contents into project memory)"
    codex_provider: "OpenAI; https://apexapi.roixw.com/v1; responses; gpt-5.5 model and review_model"
    listen_addr: "0.0.0.0:8787"
    backend_revision: "0b2a374dcb0e660b8feb8a433c1671b6c84c3308"
    frontend_assets: "index-BMrQtTyQ.js / index-Bw5xPw5Q.css (2026-10-29 tablet and directory-picker repair)"
    credential_store: "Local Windows Credential Manager; never copy secret values into this file."
    ssh_credential_entry: "codex:ssh:8.148.225.35:root"
    web_credential_entry: "code-terminal:http:8.148.225.35:8787"
    access: "Token required. User explicitly accepted public HTTP on 2026-10-28; traffic is not encrypted."
    boundaries:
      - "Separate product from wealth-product-tracker on the same host. Do not reuse its web credentials."
      - "Do not modify Dify, FileSync, shared reverse proxies, certificates, or the wealth containers."
      - "Root runtime permits opening and creating server project directories, including /opt; preserve token authentication."
      - "Dify/FileSync directories and the shared Docker socket remain masked by systemd. This is a boundary safeguard, not a security isolation guarantee for a root process."
    deployment_record: "docs/deployment-20261028.md"
  previous_phone_server:
    host: "8.130.142.159"
    public_url: "http://8.130.142.159:8787/"
    ssh_user: "root"
    app_dir: "/opt/code-terminal"
    dist_dir: "/opt/code-terminal/dist"
    service: "code-terminal.service"
    env_file: "/etc/code-terminal.env"
    state_file: "/opt/code-terminal-state/workbench-state.json"
    listen_addr: "0.0.0.0:8787"
    deploy_method:
      - "Build local frontend dist."
      - "Create a tar from dist into a temporary ignored path."
      - "Upload the tar to /tmp on the server."
      - "Extract to a timestamped /opt/code-terminal/dist.deploy-* directory."
      - "Verify index.html and hashed JS/CSS exist before switching."
      - "Move current /opt/code-terminal/dist to dist.bak-*."
      - "Move the new directory to /opt/code-terminal/dist."
      - "Restart code-terminal.service."
      - "Verify systemctl is-active, ss :8787, local curl, and public curl."
    secret_policy: "Never store the root password or CODE_TERMINAL_TOKEN in repo files, commits, harness memory, or final answers."

validation:
  local_testing:
    - "When the user asks to start local testing, run the full backend server with npm run server instead of vite preview, because the phone/Web UI needs the Rust event/terminal API routes."
    - "Default local full-stack URL is http://127.0.0.1:8787/ and does not require a token."
    - "Do not use vite preview for user acceptance testing unless the user explicitly asks for static frontend-only preview."
    - "For phone access to the full backend from LAN, non-localhost binding requires CODE_TERMINAL_TOKEN; do not store or print persistent tokens."
  frontend:
    - "npm run build:frontend"
  desktop:
    - "npm run build"
    - "npm run bundle:mac"
  mobile_ui:
    viewports:
      - "390x844"
      - "360x740"
    checks:
      - "No overlap between workspace actions and appearance controls."
      - "Color controls remain visible and clickable."
      - "Mobile chrome hide mode maximizes the terminal area."
      - "Composer still keeps Enter send and Shift+Enter newline behavior."
  server:
    - "systemctl is-active code-terminal.service"
    - "ss -ltnp | grep ':8787'"
    - "curl -fsS http://127.0.0.1:8787/ | sed -n '1,20p'"
    - "curl.exe -fsS -I http://8.148.225.35:8787/"

ux_memory:
  mobile:
    - "The phone Web UI should prioritize terminal space."
    - "Top function buttons must be hideable or compact on mobile."
    - "Toolbar/actions must not squeeze the color/theme/font controls."
    - "Appearance controls should wrap, scroll, or collapse instead of compressing."
    - "Font-size and line-height steppers must not overlap on phone widths; validate their groups, steppers, and inputs separately."
    - "Mobile view switches occupy a separate toolbar above terminal content; keep touch targets at least 44px high, including short software-keyboard viewports."
    - "Touch swipes scroll normal terminal history locally and use xterm wheel handling for alternate-screen or mouse-aware TUIs; swiping must not focus the terminal keyboard."
    - "Dialog output follows only while at the bottom; preserve reading position during incoming output and view switches, with a return-to-latest control."
    - "The mobile composer opens by default and offers horizontally scrolling TUI keys. Tab transfers a single-line draft for completion without Enter; an empty send button confirms the TUI."
    - "Touch composer controls depend on pointer: coarse, not a maximum viewport width; unfolded phones/tablets must retain shortcuts above 720px, across folding and keyboard-height changes."
    - "Tablets use the touch project drawer and non-overlapping terminal toolbar in portrait and landscape; above 720px show terminal tab labels, bound the settings panel width, and retain 44px input/action targets. Mouse desktops retain their layout."
    - "Both views use a Word-style history scrollbar: a slim 6px desktop / 8px touch thumb tracks reading position and viewport-to-content ratio (32px minimum); drag to seek, click the transparent 12px track to page. No fixed-center handle, wide gray rail or large arrow buttons. The thumb has an 18px / 32px transparent hit target. Program-managed TUIs must retain a movable 48px drag control that sends relative wheel input, supports edge-hold scrolling until release, and track-click paging without claiming a percentage. Leaving TUI restores the history scrollbar. Empty normal history has no slider."
  terminal_input:
    - "Program-managed TUI scrolling stores cumulative logical distance from the bottom, not a clamped pixel fraction. Its estimated range grows with explored history and is retained on reverse scrolling. Wheel, grip dragging, track paging and edge-hold use this same model; short viewports must not reach the end faster. Without program-provided bounds this remains an estimate, not an exact reading percentage."
    - "TUI native wheel, content touch swipes and the right-side grip must update the same relative control position. Observe wheel in capture phase before xterm stops propagation; do not double-count wheel events synthesized by the grip itself. Normal history and dialog use their actual scroll positions."
    - "Enter sends when composer has text."
    - "Shift+Enter inserts newline."
    - "Empty composer Enter and navigation keys pass through to the active TUI/terminal."

known_untracked_do_not_touch:
  - "code-terminal-deploy.tar"
  - "docs/PixPin_2026-06-10_08-37-13.mp4"
